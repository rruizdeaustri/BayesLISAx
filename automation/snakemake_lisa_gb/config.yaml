repo_root: /r5/home/rruiz/projects/sbi/BayesLISAx
#base_json: /r5/home/rruiz/projects/sbi/BayesLISAx/examples/json/lisa_gb_transdim.json
base_json: /r5/home/rruiz/projects/sbi/BayesLISAx/examples/json/lisa_gb_sangria_obs.json
python: /r5/home/rruiz/software/miniconda3/envs/blackjax-ns/bin/python
problem_factory: jax_samplers.problems.lisa_gb_transdim_problem:make
workflow_mode: production

static_ns:
  algo: ns
  k_values: [1, 2, 3, 4, 5]
  seeds: [0, 11, 22]
  n_live: 500
  num_delete_ratio: 0.1
  num_inner_steps: 64
  tol: 2
  skip_plots: true

highres:
  enabled: true
  seeds: [0, 11, 22]
  n_live: 1000
  num_delete_ratio: 0.1
  num_inner_steps: 96
  tol: 1
  skip_plots: true

consensus:
  enabled: true
  dim_per: 7
  f0_index: 0
  p_index: 6
  p_active_min: 0.5

# Small workflow-only check. Set workflow_mode: dry_run or pass --config workflow_mode=dry_run. Use with a one-row bands.csv.
# Previous command-line overrides can still be supplied manually if desired.
# Example: --config static_ns.k_values='[1,2]' static_ns.seeds='[0]' static_ns.n_live=32 static_ns.num_inner_steps=4 highres.n_live=32 highres.num_inner_steps=4
# and a one-row bands.csv.
dry_run:
  k_values: [1, 2]
  seeds: [0]
  n_live: 32
  num_inner_steps: 4

catalogue:
  margin_hz: 5.0e-6
  snr_thresholds: [0.5, 1, 2, 3, 4, 5, 7, 10]
  top_n: 40

results_dir: results
logs_dir: logs
selection_delta_logz: 1.0

# Legacy two-phase keys retained for existing external overrides/scripts.
scan:
  kmax_values: [1, 2, 3]
  n_live: 500
  tol: 1.0
  num_inner_steps: 32
  seeds: [0]
  skip_plots: true
final:
  n_live: 1000
  tol: 1.0
  num_inner_steps: 64
  seeds: [0]
  skip_plots: false
  no_show: true
  save_plot: "results/final/b_test/corner.png"

benchmark:
  enabled: false
  preset: smoke
  algos: []
  seeds: []
  n_live: []
  tol: []
  num_inner_steps: []
  ggns_step_size: []
  ggns_num_inner_steps: []
  initial_num_steps: []
  refinement_num_steps: []
  max_batches: []
  ess_min: 50
  bad_logz_min: -1.0e99
  local_mode_f0_sigma_max: 1.0e-7
  presets:
    smoke:
      algos: [ns]
      seeds: [0]
      n_live: [64]
      tol: [1.0]
      num_inner_steps: [4]
      ggns_step_size: [0.001]
      ggns_num_inner_steps: [1]
      initial_num_steps: [4]
      refinement_num_steps: [2]
      max_batches: [2]
    pilot:
      algos: [ns]
      seeds: [0]
      n_live: [500]
      tol: [1.0]
      num_inner_steps: [8]
      ggns_step_size: [0.001]
      ggns_num_inner_steps: [1]
      initial_num_steps: [16]
      refinement_num_steps: [8]
      max_batches: [4]
    production:
      algos: [ns]
      seeds: [0]
      n_live: [2000]
      tol: [0.1]
      num_inner_steps: [16]
      ggns_step_size: [0.001]
      ggns_num_inner_steps: [1]
      initial_num_steps: [16]
      refinement_num_steps: [8]
      max_batches: [8]

sangria:
  h5_path: "/r5/home/rruiz/projects/sbi/lisa/data/LDC2_sangria_training_v2.h5"
  inspection_json: "results/sangria/inspection.json"
  windows_csv: "results/sangria/windows.csv"
  f_min: 0.0001
  f_max: 0.02
  tobs: 31457280.0
  core_width: 0.00001
  guard_width: 0.000002
  overlap: 0.0
  snr_threshold: null
